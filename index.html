<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

    <title>Online Student Registration Form</title>

    <style>
        .header h3{
            text-align: left;
        }
    </style>
</head>
<link rel="stylesheet" href="style.css">

<body>
    <div class="main_container">
        <div class="header">
            <h1>Online Student Registration Form</h1>
            <h2>Student please submit all your details in this form.</h2>
            <h3>Personal Details</h3>
        </div>

        <div class="details">
            <span>
                <label for="name">First Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter first name" required>
            </span>
            <span>
                <label for="name">Last Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter last name" required>
            </span>
        </div>
        <div class="details">
            <span class="address">
                <label for="address">Address</label>
                <input type="text" id="address" placeholder="Enter your address" required>
            </span>
            <span>
                <label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                    <option value="" disabled selected>Select gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </span>
        </div>
        <div class="details">
            <span>
                <label for="mobile">Mobile Number:</label>
                <input type="tel" id="mobile" name="mobile" placeholder="98********" pattern="[0-9]{10}" maxlength="10"
                    required>
            </span>
            <span>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </span>
        </div>
        <!-- <div class="details">
    
</div> -->
        <form id="myForm">
            <!-- the .details divs go here -->
            <button type="submit">Submit</button>
        </form>

        <script>
            document.getElementById("myForm").addEventListener("submit", function (e) {
                e.preventDefault();  // stop page reload

                const firstName = document.getElementById("first-name").value.trim();
                const lastName = document.getElementById("last-name").value.trim();
                const mobile = document.getElementById("mobile").value.trim();
                const email = document.getElementById("email").value.trim();

                console.log(firstName, lastName, mobile, email);
            });
        </script>
    </div>
</body>

</html>
