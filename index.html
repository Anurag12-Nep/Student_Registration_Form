<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Student Registration Form</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="main_container">
        <header class="header">
            <h1>Online Student Registration Form</h1>
            <p>Please submit all your details in this form.</p>
        </header>

        <form id="myForm" novalidate>
            <h2>Personal Details</h2>

            <div class="details">
                <div class="field">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" name="firstName" placeholder="Enter first name" autocomplete="given-name" required>
                </div>
                <div class="field">
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" name="lastName" placeholder="Enter last name" autocomplete="family-name" required>
                </div>
            </div>

            <div class="details">
                <div class="field">
                    <label for="dob">Date of Birth</label>
                    <input type="text" id="dob" name="dob" placeholder="DD/MM/YYYY" autocomplete="bday" required>
                </div>
                <div class="field">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="" disabled selected>Select gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>

            <div class="details">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="name@school.edu" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="mobile">Mobile</label>
                    <input type="tel" id="mobile" name="mobile" placeholder="98XXXXXXXX" autocomplete="tel" pattern="[0-9+\s\-]{7,15}" required>
                </div>
            </div>

            <button type="submit">Submit</button>
            <p id="message" role="status"></p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        flatpickr("#dob", { dateFormat: "d/m/Y", maxDate: "today", allowInput: true });

        const form = document.getElementById("myForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", (e) => {
            e.preventDefault();

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const data = Object.fromEntries(new FormData(form));
            console.log(data);

            message.textContent = "Form submitted. Thank you!";
            form.reset();
        });
    </script>
</body>
</html>
